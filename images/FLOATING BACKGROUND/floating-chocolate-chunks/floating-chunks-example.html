<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Chocolate Chunks Example</title>
  <link rel="stylesheet" href="floating-chocolate-chunks.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden; /* Prevent scrollbars from floating elements */
    }

    .content {
      text-align: center;
      color: white;
      z-index: 1;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.5rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Your main content -->
  <div class="content">
    <h1>Ice Cream Flavors</h1>
    <p>Chocolate makes everything better</p>
  </div>

  <!-- Floating Chocolate Chunks -->
  <!-- Replace src with your actual chocolate chunk PNGs -->
  <!-- All chunks float BEHIND the main content with different organic patterns -->

  <img src="chocolate-chunk-1.png" class="chocolate-chunk position-1" alt="Floating chocolate chunk 1">
  <img src="chocolate-chunk-2.png" class="chocolate-chunk position-2" alt="Floating chocolate chunk 2">
  <img src="chocolate-chunk-3.png" class="chocolate-chunk position-3" alt="Floating chocolate chunk 3">
  <img src="chocolate-chunk-4.png" class="chocolate-chunk position-4" alt="Floating chocolate chunk 4">
  <img src="chocolate-chunk-5.png" class="chocolate-chunk position-5" alt="Floating chocolate chunk 5">
  <img src="chocolate-chunk-6.png" class="chocolate-chunk position-6" alt="Floating chocolate chunk 6">
  <img src="chocolate-chunk-7.png" class="chocolate-chunk position-7" alt="Floating chocolate chunk 7">
  <img src="chocolate-chunk-8.png" class="chocolate-chunk position-8" alt="Floating chocolate chunk 8">

</body>
</html>
